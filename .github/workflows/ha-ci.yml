name: ha-ci

# Developer-feedback CI: hassfest, ruff lint, ruff format, pytest. HACS distribution
# validation lives in hacs-validate.yml — it needs a scheduled trigger to catch upstream
# HACS rule changes that aren't tied to our commits.

on:
  pull_request:
  workflow_dispatch:
  push:
    branches: [master, main]

permissions:
  contents: read

jobs:
  hassfest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Hassfest
        uses: home-assistant/actions/hassfest@master

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install ruff
        run: pip install ruff
      - name: ruff check
        run: ruff check .
      - name: ruff format
        run: ruff format --check .

  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: requirements_test.txt
      - name: Install test deps (pulls HA core via pytest-homeassistant-custom-component)
        run: pip install -r requirements_test.txt
      - name: pytest
        run: pytest
